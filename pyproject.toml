[project]
name = "moni-token"
version = "0.2.0"
description = "Explains why Claude Code usage spiked and shows where your agents are working, from local logs only. No LLM calls, no network."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
moni-token = "moni_token.cli:main"
moni-token-statusline = "moni_token.statusline:main"   # fast path for Claude Code's statusLine

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
